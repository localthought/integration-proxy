name: CI

# This repository is only the Heroku deployment wrapper for localthought.io.
# The proxy itself, and its tests (including the PostgreSQL-backed ones), live
# in ontola/atomic-plugins' integration-proxy/ and run in that repo's CI. Here
# we only check that the wrapper builds from the committed Cargo.lock, which is
# exactly what Heroku deploys.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build (release, as Heroku does)
        run: cargo build --locked --release
      - name: Binary exits with a configuration error when unconfigured
        run: |
          set +e
          output=$(env -i PATH="$PATH" ./target/release/auth-proxy 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 0
          echo "$output" | grep -q '^configuration error: '
