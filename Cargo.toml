# Deployment wrapper for localthought.io (Heroku). All proxy code lives in the
# `atomic-integration-proxy` crate, developed in
# https://github.com/ontola/atomic-plugins/tree/main/integration-proxy; this
# package is the template from that repo's
# integration-proxy/examples/heroku-wrapper/.
#
# The package and binary stay named `auth-proxy` so the existing
# `web: target/release/auth-proxy` Procfile line keeps working unchanged.
[package]
name = "auth-proxy"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
# Published to crates.io from ontola/atomic-plugins' integration-proxy/.
# Bump this (and run `cargo update -p atomic-integration-proxy`) to deploy a
# new release.
atomic-integration-proxy = "0.2.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
opt-level = 3
lto = true
