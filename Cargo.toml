# Deployment wrapper for localthought.io (Heroku). All proxy code lives in the
# `atomic-integration-proxy` crate, developed in
# https://github.com/ontola/atomic-plugins/tree/main/integration-proxy; this
# package is the template from that repo's
# integration-proxy/examples/heroku-wrapper/.
#
# The package and binary stay named `auth-proxy` so the existing
# `web: target/release/auth-proxy` Procfile line keeps working unchanged.
[package]
name = "auth-proxy"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
# Pinned to an ontola/atomic-plugins commit because the crate is not on
# crates.io yet; cargo finds the `atomic-integration-proxy` package in that
# repo's integration-proxy/ subdirectory by name. To deploy a newer proxy,
# change `rev` and run `cargo update -p atomic-integration-proxy`.
# TODO: once `atomic-integration-proxy` is published to crates.io, replace
# this line with `atomic-integration-proxy = "0.1"` (i.e. `version = "0.1"`).
atomic-integration-proxy = { git = "https://github.com/ontola/atomic-plugins", rev = "494eb8af139b60a41e5197c92053890c0d841b2f" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
opt-level = 3
lto = true
